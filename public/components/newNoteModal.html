<!-- Modal Component: Create New Note -->
<style>
    html:not(.dark) #newNoteModal > div,
    html.light #newNoteModal > div {
        background: #ffffff !important;
        color: #0f172a !important;
        border-color: rgba(109, 40, 217, 0.25) !important;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12) !important;
    }
    html:not(.dark) #newNoteModal h3,
    html.light #newNoteModal h3 {
        color: #6d28d9 !important;
    }
    html:not(.dark) #newNoteModal label,
    html.light #newNoteModal label {
        color: #334155 !important;
    }
    html:not(.dark) #newNotePathInput,
    html:not(.dark) #newNoteContentInput,
    html.light #newNotePathInput,
    html.light #newNoteContentInput {
        background-color: #f8fafc !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
    }
</style>
<div id="newNoteModal"
    class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="glass-panel w-full max-w-lg rounded-2xl border border-white/15 p-6 shadow-2xl flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-white/10 pb-3">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">note_add</span>
                <h3 class="font-headline-md text-base font-semibold text-primary">Tạo Note Mới Trực Tiếp Trên GitHub
                </h3>
            </div>
            <button id="btnCloseNewNoteModal" class="text-on-surface-variant hover:text-on-surface">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="flex flex-col gap-3 text-xs">
            <div>
                <label class="block mb-1 font-label-caps text-on-surface-variant">Đường dẫn file (Vd:
                    Projects/BrainDashboard.md hoặc Wiki/Topic.md):</label>
                <input id="newNotePathInput" type="text" placeholder="Wiki/TenGhiChuMoi.md"
                    class="w-full bg-slate-900/90 border border-white/20 rounded-lg px-3 py-2 text-xs text-white font-medium placeholder:text-slate-400 outline-none focus:border-primary/50">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="font-label-caps text-on-surface-variant">Nội dung ban đầu:</label>
                    <div id="newNoteTokenBadge" class="text-[10px] font-mono text-amber-300 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs">token</span>
                        <span>0 tokens (~$0.000000)</span>
                    </div>
                </div>
                <textarea id="newNoteContentInput" rows="6" placeholder="# Tiêu đề ghi chú mới&#10;&#10;Nội dung..."
                    class="w-full bg-slate-900/90 border border-white/20 rounded-lg p-3 text-xs font-mono text-white font-medium placeholder:text-slate-400 outline-none focus:border-primary/50 resize-none"></textarea>
            </div>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2 border-t border-white/10">
            <button id="btnCancelNewNote"
                class="px-4 py-2 rounded-lg bg-white/5 text-on-surface-variant hover:bg-white/10 text-xs font-semibold">Hủy</button>
            <button id="btnSubmitNewNote"
                class="px-4 py-2 rounded-lg bg-primary text-on-primary hover:brightness-110 text-xs font-semibold flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">cloud_upload</span>
                Tạo & Commit GitHub
            </button>
        </div>
    </div>
</div>
