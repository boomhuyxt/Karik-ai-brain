<!-- Top Action Bar Component (Responsive) -->
<header class="absolute top-0 left-0 right-0 z-30 min-h-[64px] glass-panel px-4 md:px-6 flex flex-col justify-center border-b border-slate-200/80 dark:border-white/10">
    <div class="flex items-center justify-between h-16 w-full">
        <!-- Logo & Brand -->
        <div class="flex items-center gap-2.5 min-w-0">
            <img src="/Logo/logo-removebg.png" alt="AI Brain Karik Logo" class="h-8 w-8 object-contain flex-shrink-0">
            <div class="min-w-0">
                <h1 class="font-headline-md text-sm md:text-base font-bold text-purple-900 dark:text-primary text-glow flex items-center gap-2 truncate">
                    <span class="truncate">Karik</span>
                    <span class="inline-block text-[10px] font-mono px-2 py-0.5 rounded-full bg-purple-100 dark:bg-primary/20 text-purple-700 dark:text-primary border border-purple-200 dark:border-primary/30 font-semibold tracking-wide">
                        beta 3.1
                    </span>
                </h1>
            </div>
        </div>

        <!-- Desktop Action Buttons (Hidden on Mobile) -->
        <div class="hidden md:flex items-center gap-2.5">
            <!-- Admin Only Header Controls -->
            <div id="adminHeaderActions" class="flex items-center gap-2.5">
                <!-- System Monitoring & Risk Dashboard Button (Moved to 1st position) -->
                <button id="btnSystemMonitor" onclick="window.openSystemMonitorModal()" title="Xem độ tiêu hao Token, Tiến độ dự án & Độ rủi ro các API"
                    class="bg-cyan-50 hover:bg-cyan-100 dark:bg-cyan-500/20 dark:hover:bg-cyan-500/30 text-cyan-900 dark:text-cyan-300 border border-cyan-300/90 dark:border-cyan-400/40 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-xs hover:shadow-sm active:scale-95 cursor-pointer">
                    <span class="material-symbols-outlined text-base text-cyan-600 dark:text-cyan-300">analytics</span>
                    <span>Giám Sát & Rủi Ro</span>
                </button>

                <!-- Post Office & Shipping Button -->
                <button id="btnPostOfficeOrders" onclick="window.openPostOfficeModal()" title="Bưu Cục Đơn Hàng & In Vận Đơn dán gói hàng"
                    class="bg-amber-50 hover:bg-amber-100 dark:bg-amber-500/20 dark:hover:bg-amber-500/30 text-amber-900 dark:text-amber-300 border border-amber-300/90 dark:border-amber-400/40 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-xs hover:shadow-sm active:scale-95 cursor-pointer">
                    <span class="material-symbols-outlined text-base text-amber-600 dark:text-amber-300">local_shipping</span>
                    <span>Bưu Cục Đơn Hàng</span>
                </button>

                <!-- Knowledge & File Storage Manager Button (Replaces old position) -->
                <button id="btnManageFiles" onclick="window.openFileManagerModal()" title="Quản lý các file Excel/CSV kiến thức kho đã upload lên Supabase"
                    class="bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-600/20 dark:hover:bg-indigo-600/30 text-indigo-900 dark:text-indigo-200 border border-indigo-300/90 dark:border-indigo-400/40 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-xs hover:shadow-sm active:scale-95 cursor-pointer">
                    <span class="material-symbols-outlined text-base text-indigo-600 dark:text-indigo-300">folder_shared</span>
                    <span>Quản Lý File Upload</span>
                </button>

                <!-- User Management Button (Admin Only) -->
                <button id="btnManageUsers" title="Quản lý tài khoản người dùng & Thống kê"
                    class="bg-purple-50 hover:bg-purple-100 dark:bg-purple-600/20 dark:hover:bg-purple-600/30 text-purple-900 dark:text-purple-200 border border-purple-300/90 dark:border-purple-400/40 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-xs hover:shadow-sm active:scale-95 cursor-pointer">
                    <span class="material-symbols-outlined text-base text-purple-600 dark:text-purple-300">group</span>
                    <span>Quản lý Users</span>
                </button>

                <!-- Daily Action Button -->
                <button id="btnOpenDaily"
                    class="bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-500/20 dark:hover:bg-emerald-500/30 text-emerald-900 dark:text-emerald-300 border border-emerald-300/90 dark:border-emerald-500/40 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-xs hover:shadow-sm active:scale-95 cursor-pointer">
                    <span class="material-symbols-outlined text-base text-emerald-600 dark:text-emerald-300">calendar_today</span>
                    <span>Ghi Daily</span>
                </button>

                <!-- New Note Button -->
                <button id="btnNewNote"
                    class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white dark:bg-primary/20 dark:hover:bg-primary/30 dark:text-primary border border-purple-600 dark:border-primary/40 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm active:scale-95 cursor-pointer">
                    <span class="material-symbols-outlined text-base">note_add</span>
                    <span>+ Tạo Note</span>
                </button>

                <!-- Refresh Button -->
                <button id="btnRefreshGraph" title="Tải lại dữ liệu từ GitHub"
                    class="bg-white hover:bg-slate-100 dark:bg-surface-container-high text-slate-800 dark:text-on-surface border border-slate-300 dark:border-white/10 px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center justify-center shadow-xs active:scale-95 cursor-pointer">
                    <span class="material-symbols-outlined text-base">refresh</span>
                </button>

                <div class="h-4 w-[1px] bg-slate-300 dark:bg-white/15 mx-1"></div>
            </div>

            <!-- Post Office Standalone Button (Visible for Post Office role when admin header is hidden) -->
            <button id="btnPostOfficeOnly" onclick="window.openPostOfficeModal()" title="Bưu Cục Đơn Hàng & In Vận Đơn dán gói hàng" style="display: none;"
                class="bg-amber-500 hover:bg-amber-600 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm active:scale-95 cursor-pointer">
                <span class="material-symbols-outlined text-base">local_shipping</span>
                <span>📦 Đơn Hàng & In Vận Đơn</span>
            </button>

            <!-- Theme Mode Switcher (Visible to All Users & Admin) -->
            <button id="btnThemeToggle" onclick="window.toggleTheme()" title="Chuyển đổi chế độ Sáng / Tối (Dark / Light)"
                class="px-2.5 py-1.5 rounded-xl bg-white hover:bg-slate-100 dark:bg-surface-container-high/80 dark:hover:bg-surface-container-high border border-slate-300 dark:border-white/10 text-slate-800 dark:text-on-surface hover:text-purple-700 dark:hover:text-primary transition-all flex items-center gap-1.5 text-xs font-bold shadow-xs cursor-pointer active:scale-95">
                <span id="themeToggleIcon" class="material-symbols-outlined text-base text-amber-500 dark:text-amber-400">light_mode</span>
                <span id="themeToggleText" class="hidden xl:inline text-[11px] font-mono font-semibold">Sáng/Tối</span>
            </button>

            <!-- User Info Badge (Visible to All Logged In Users) -->
            <div id="userBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white dark:bg-surface-container-high/60 border border-slate-300 dark:border-white/10 text-xs font-semibold shadow-xs">
                <span class="material-symbols-outlined text-purple-600 dark:text-purple-300 text-base">account_circle</span>
                <span id="userNameDisplay" class="font-bold text-slate-900 dark:text-gray-200 truncate max-w-[140px]">AI Admin</span>
                <span id="userRoleTag" class="text-[9px] font-mono font-bold px-1.5 py-0.2 rounded bg-purple-100 dark:bg-purple-500/20 text-purple-800 dark:text-purple-300 border border-purple-300 dark:border-purple-400/30">ADMIN</span>
            </div>

            <!-- Logout Button -->
            <button id="btnLogout" title="Đăng xuất khỏi hệ thống"
                class="bg-red-50 hover:bg-red-100 dark:bg-red-500/15 dark:hover:bg-red-500/25 text-red-800 dark:text-red-300 border border-red-300 dark:border-red-500/35 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-xs hover:shadow-sm active:scale-95 cursor-pointer">
                <span class="material-symbols-outlined text-base text-red-600 dark:text-red-400">logout</span>
                <span>Đăng xuất</span>
            </button>
        </div>

        <!-- Mobile Controls (Hamburger Menu Button) -->
        <div class="flex md:hidden items-center gap-2">
            <button id="btnThemeToggleMobileQuick" onclick="window.toggleTheme()" title="Chuyển chế độ Sáng / Tối"
                class="bg-slate-100 hover:bg-slate-200 dark:bg-surface-container-high text-slate-800 dark:text-on-surface border border-slate-300/80 dark:border-white/10 p-2 rounded-lg text-xs transition-all flex items-center justify-center cursor-pointer">
                <span id="themeToggleIconMobileQuick" class="material-symbols-outlined text-base text-amber-500 dark:text-amber-400">light_mode</span>
            </button>

            <button id="btnRefreshGraphMobile" title="Tải lại dữ liệu"
                class="bg-slate-100 hover:bg-slate-200 dark:bg-surface-container-high text-slate-800 dark:text-on-surface border border-slate-300/80 dark:border-white/10 p-2 rounded-lg text-xs transition-all flex items-center justify-center">
                <span class="material-symbols-outlined text-base">refresh</span>
            </button>

            <button id="btnMobileMenuToggle" aria-label="Mở menu"
                class="bg-purple-100 dark:bg-primary/20 text-purple-700 dark:text-primary border border-purple-300 dark:border-primary/30 p-2 rounded-lg transition-all hover:bg-purple-200 dark:hover:bg-primary/30 flex items-center justify-center">
                <span id="mobileMenuIcon" class="material-symbols-outlined text-xl">menu</span>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation Drawer / Dropdown Menu -->
    <div id="mobileNavMenu" class="hidden md:hidden pb-4 pt-2 border-t border-slate-200 dark:border-white/10 space-y-3 animate-fadeIn">
        <!-- User Info Mobile -->
        <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-100 dark:bg-surface-container-high/60 border border-slate-300/80 dark:border-white/10 text-xs">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-purple-600 dark:text-purple-300 text-base">account_circle</span>
                <span id="userNameDisplayMobile" class="font-semibold text-slate-800 dark:text-gray-200">AI Admin</span>
            </div>
            <span id="userRoleTagMobile" class="text-[10px] text-emerald-700 dark:text-emerald-400 font-mono bg-emerald-100 dark:bg-emerald-900/40 px-2 py-0.5 rounded border border-emerald-300 dark:border-emerald-500/30">ADMIN</span>
        </div>

        <!-- Theme Toggle Mobile Full Item -->
        <button id="btnThemeToggleMobile" onclick="window.toggleTheme()"
            class="w-full flex items-center justify-between px-3 py-2 rounded-xl bg-slate-100 dark:bg-surface-container-high/80 border border-slate-300/80 dark:border-white/10 text-xs font-semibold text-slate-800 dark:text-on-surface transition-all">
            <div class="flex items-center gap-2">
                <span id="themeToggleIconMobile" class="material-symbols-outlined text-base text-amber-500 dark:text-amber-400">light_mode</span>
                <span>Giao diện: <span id="themeToggleLabelMobile">Tối (Dark)</span></span>
            </div>
            <span id="themeModeBadgeMobile" class="text-[10px] font-mono px-2 py-0.5 rounded bg-purple-100 dark:bg-primary/20 text-purple-700 dark:text-primary border border-purple-300 dark:border-primary/30">DARK</span>
        </button>

        <!-- Post Office Only Mobile Button -->
        <button id="btnPostOfficeMobileOnly" onclick="window.openPostOfficeModal()" style="display: none;"
            class="w-full bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-sm">
            <span class="material-symbols-outlined text-base">local_shipping</span>
            <span>📦 Bưu Cục & In Vận Đơn</span>
        </button>

        <!-- Admin Only Mobile Controls -->
        <div id="adminMobileActions" class="space-y-3">
            <!-- Action Buttons Grid -->
            <div class="grid grid-cols-2 gap-2">
                <button id="btnPostOfficeOrdersMobile" onclick="window.openPostOfficeModal()"
                    class="w-full bg-amber-50 hover:bg-amber-100 dark:bg-amber-600/20 dark:hover:bg-amber-600/30 text-amber-800 dark:text-amber-200 border border-amber-300 dark:border-amber-400/40 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all col-span-2">
                    <span class="material-symbols-outlined text-base text-amber-600 dark:text-amber-300">local_shipping</span>
                    <span>Bưu Cục & In Vận Đơn</span>
                </button>

                <button id="btnSystemMonitorMobile" onclick="window.openSystemMonitorModal()"
                    class="w-full bg-cyan-50 hover:bg-cyan-100 dark:bg-cyan-600/20 dark:hover:bg-cyan-600/30 text-cyan-800 dark:text-cyan-200 border border-cyan-300 dark:border-cyan-400/40 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all col-span-2">
                    <span class="material-symbols-outlined text-base text-cyan-600 dark:text-cyan-300">analytics</span>
                    <span>Giám Sát Token & Rủi Ro API</span>
                </button>

                <button id="btnManageFilesMobile" onclick="window.openFileManagerModal()"
                    class="w-full bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-600/20 dark:hover:bg-indigo-600/30 text-indigo-800 dark:text-indigo-200 border border-indigo-300 dark:border-indigo-400/40 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all col-span-2">
                    <span class="material-symbols-outlined text-base text-indigo-600 dark:text-indigo-300">folder_shared</span>
                    <span>Quản Lý File Upload & Kho</span>
                </button>

                <button id="btnManageUsersMobile"
                    class="w-full bg-purple-50 hover:bg-purple-100 dark:bg-purple-600/20 dark:hover:bg-purple-600/30 text-purple-800 dark:text-purple-200 border border-purple-300 dark:border-purple-400/40 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all col-span-2">
                    <span class="material-symbols-outlined text-base text-purple-600 dark:text-purple-300">group</span>
                    <span>Quản lý Users & Thống kê</span>
                </button>

                <button id="btnOpenDailyMobile"
                    class="w-full bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-700 dark:text-emerald-300 border border-emerald-500/40 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all">
                    <span class="material-symbols-outlined text-base">calendar_today</span>
                    <span>Ghi Daily</span>
                </button>

                <button id="btnNewNoteMobile"
                    class="w-full bg-primary/20 hover:bg-primary/30 text-primary border border-primary/40 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all">
                    <span class="material-symbols-outlined text-base">note_add</span>
                    <span>+ Tạo Note</span>
                </button>
            </div>
        </div>

        <!-- Logout Button Mobile -->
        <button id="btnMobileLogout"
            class="w-full bg-red-500/15 hover:bg-red-500/25 text-red-600 dark:text-red-300 border border-red-500/35 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all">
            <span class="material-symbols-outlined text-base">logout</span>
            <span>Đăng xuất hệ thống</span>
        </button>
    </div>
</header>
