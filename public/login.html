<!DOCTYPE html>
<html class="dark" lang="vi">

<head>
    <script>
        // Anti-FOUC immediate theme applicator
        (function() {
            try {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                if (savedTheme === 'light') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                } else {
                    document.documentElement.classList.remove('light');
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>AI Brain Karik - Đăng nhập / Đăng ký</title>
    <link rel="icon" type="image/png" href="/Logo/logo-removebg.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-dim": "#10131a",
                        "surface": "#10131a",
                        "surface-container": "#1d2026",
                        "surface-container-high": "#272a31",
                        "primary": "#d3bbff",
                        "primary-container": "#6d28d9",
                        "secondary": "#5de6ff",
                        "mint": "#34d399",
                        "background": "#10131a"
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        sora: ["Sora", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .dark .glass-panel {
            background: rgba(29, 32, 38, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(211, 187, 255, 0.12);
        }
        html:not(.dark) .glass-panel,
        html.light .glass-panel {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(109, 40, 217, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(109, 40, 217, 0.4);
        }
        .glow-effect:hover {
            box-shadow: 0 0 35px 0px rgba(109, 40, 217, 0.6);
        }
        .dark .tab-btn.active {
            color: #d3bbff;
            border-bottom: 2px solid #d3bbff;
            background-color: rgba(109, 40, 217, 0.15);
        }
        html:not(.dark) .tab-btn.active,
        html.light .tab-btn.active {
            color: #6d28d9;
            border-bottom: 2px solid #6d28d9;
            background-color: rgba(109, 40, 217, 0.08);
        }

        /* Light Mode Form Adjustments */
        html:not(.dark) body, html.light body {
            background-color: #f8fafc !important;
            color: #1e293b !important;
        }
        html:not(.dark) input, html.light input {
            background-color: #ffffff !important;
            color: #0f172a !important;
            border-color: #cbd5e1 !important;
        }
        html:not(.dark) input::placeholder, html.light input::placeholder {
            color: #94a3b8 !important;
        }
        html:not(.dark) label, html.light label {
            color: #334155 !important;
        }
        html:not(.dark) h1, html.light h1 {
            color: #0f172a !important;
        }
    </style>
</head>

<body class="bg-background text-gray-200 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-purple-500 selection:text-white transition-colors duration-200">

    <!-- Top Floating Dark/Light Toggle Button -->
    <div class="fixed top-4 right-4 z-50">
        <button id="btnLoginThemeToggle" onclick="toggleLoginTheme()" title="Chuyển đổi giao diện Sáng / Tối"
            class="p-2.5 rounded-2xl glass-panel border flex items-center gap-2 text-xs font-semibold text-slate-300 hover:text-purple-400 transition-all shadow-md active:scale-95 cursor-pointer">
            <span id="loginThemeIcon" class="material-symbols-outlined text-base text-amber-400">light_mode</span>
            <span id="loginThemeText" class="text-xs font-mono">Sáng/Tối</span>
        </button>
    </div>

    <!-- Background glowing Orbs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-900/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-cyan-900/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Auth Card -->
    <div class="w-full max-w-md glass-panel rounded-2xl shadow-2xl p-8 z-10 relative">

        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-purple-950/40 p-2 mb-3 shadow-lg glow-effect border border-purple-500/30">
                <img src="/Logo/logo-removebg.png" alt="AI Brain Karik Logo" class="w-full h-full object-contain filter drop-shadow">
            </div>
            <h1 class="font-sora text-2xl font-bold text-white tracking-tight">AI Brain Karik</h1>
            <p class="text-sm text-gray-400 mt-1">Hệ thống Quản lý tri thức & Trợ lý AI</p>
        </div>

        <!-- Toast Alert Banner -->
        <div id="toast" class="hidden mb-6 p-4 rounded-xl text-sm flex items-center gap-3 transition-all duration-300">
            <span id="toast-icon" class="material-symbols-outlined text-xl">info</span>
            <span id="toast-message" class="flex-1 font-medium"></span>
        </div>

        <!-- Tabs Navigation -->
        <div class="flex border-b border-gray-700/60 mb-6 text-sm font-semibold rounded-t-xl overflow-hidden bg-surface-container/50">
            <button id="tab-login" onclick="switchTab('login')" class="tab-btn active flex-1 py-3 text-center transition-all duration-200 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-lg">login</span> Đăng nhập
            </button>
            <button id="tab-register" onclick="switchTab('register')" class="tab-btn flex-1 py-3 text-center text-gray-400 transition-all duration-200 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-lg">person_add</span> Đăng ký
            </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2" for="login-email">Email hệ thống</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-xl">mail</span>
                    <input type="email" id="login-email" required placeholder="name@example.com" class="w-full bg-surface-container-high/80 border border-gray-700 rounded-xl py-2.5 pl-11 pr-4 text-white text-sm focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2" for="login-password">Mật khẩu</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-xl">lock</span>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-surface-container-high/80 border border-gray-700 rounded-xl py-2.5 pl-11 pr-11 text-white text-sm focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition-all">
                    <button type="button" onclick="togglePasswordVisibility('login-password', this)" class="absolute right-3.5 top-3 text-gray-400 hover:text-white">
                        <span class="material-symbols-outlined text-xl">visibility</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-gray-400">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked class="rounded border-gray-700 bg-surface-container-high text-purple-500 focus:ring-0 focus:ring-offset-0">
                    <span>Ghi nhớ đăng nhập</span>
                </label>
                <button type="button" onclick="openForgotModal()" class="text-purple-300 hover:underline hover:text-purple-200 font-medium">Quên mật khẩu?</button>
            </div>

            <button type="submit" id="btn-login-submit" class="w-full py-3 px-4 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg glow-effect transition-all duration-200 flex items-center justify-center gap-2">
                <span>Đăng nhập</span>
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
            </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1.5" for="reg-fullname">Họ và tên</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-xl">badge</span>
                    <input type="text" id="reg-fullname" required placeholder="Nguyễn Văn A" class="w-full bg-surface-container-high/80 border border-gray-700 rounded-xl py-2.5 pl-11 pr-4 text-white text-sm focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1.5" for="reg-email">Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-xl">mail</span>
                    <input type="email" id="reg-email" required placeholder="name@example.com" class="w-full bg-surface-container-high/80 border border-gray-700 rounded-xl py-2.5 pl-11 pr-4 text-white text-sm focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1.5" for="reg-password">Mật khẩu</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-xl">lock</span>
                    <input type="password" id="reg-password" required minlength="6" placeholder="Tối thiểu 6 ký tự" class="w-full bg-surface-container-high/80 border border-gray-700 rounded-xl py-2.5 pl-11 pr-11 text-white text-sm focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition-all">
                    <button type="button" onclick="togglePasswordVisibility('reg-password', this)" class="absolute right-3.5 top-3 text-gray-400 hover:text-white">
                        <span class="material-symbols-outlined text-xl">visibility</span>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1.5" for="reg-confirm-password">Xác nhận mật khẩu</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-xl">verified_user</span>
                    <input type="password" id="reg-confirm-password" required minlength="6" placeholder="Nhập lại mật khẩu" class="w-full bg-surface-container-high/80 border border-gray-700 rounded-xl py-2.5 pl-11 pr-11 text-white text-sm focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition-all">
                    <button type="button" onclick="togglePasswordVisibility('reg-confirm-password', this)" class="absolute right-3.5 top-3 text-gray-400 hover:text-white">
                        <span class="material-symbols-outlined text-xl">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-register-submit" class="w-full py-3 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold rounded-xl shadow-lg glow-effect transition-all duration-200 flex items-center justify-center gap-2">
                <span>Tạo tài khoản</span>
                <span class="material-symbols-outlined text-lg">check_circle</span>
            </button>
        </form>

        <!-- FORGOT PASSWORD MODAL -->
        <div id="forgotModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
            <div class="glass-panel w-full max-w-md rounded-2xl p-6 relative space-y-4 animate-fadeIn shadow-2xl border border-purple-500/30">
                <div class="flex items-center justify-between border-b border-gray-700 pb-3">
                    <h2 class="font-sora text-lg font-bold text-white flex items-center gap-2">
                        <span class="material-symbols-outlined text-amber-400">mark_email_unread</span> Quên Mật Khẩu
                    </h2>
                    <button type="button" onclick="closeForgotModal()" class="text-gray-400 hover:text-white">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <!-- Step 1: Send OTP -->
                <div id="forgotStep1" class="space-y-4">
                    <p class="text-xs text-gray-300">Nhập email tài khoản của bạn. Hệ thống sẽ gửi mã xác nhận OTP 6 chữ số qua Gmail.</p>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1.5" for="forgot-email">Email tài khoản</label>
                        <input type="email" id="forgot-email" placeholder="name@example.com" class="w-full bg-surface-container-high/80 border border-gray-700 rounded-xl py-2.5 px-4 text-white text-sm focus:border-purple-400 outline-none">
                    </div>
                    <button type="button" id="btnSendOtp" onclick="handleSendOtp()" class="w-full py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold rounded-xl shadow transition-all">Gửi mã OTP qua Gmail</button>
                </div>

                <!-- Step 2: Input OTP & New Password -->
                <div id="forgotStep2" class="space-y-3 hidden">
                    <div id="devOtpNotice" class="hidden p-2.5 bg-amber-900/40 border border-amber-500/40 rounded-xl text-xs text-amber-200">
                        🔑 <strong>Mã OTP Dev:</strong> <span id="devOtpValue" class="font-mono text-cyan-300 font-bold"></span>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1" for="reset-otp">Mã OTP (6 chữ số)</label>
                        <input type="text" id="reset-otp" placeholder="123456" maxlength="6" class="w-full bg-surface-container-high/80 border border-gray-700 rounded-xl py-2 px-4 text-white text-sm font-mono tracking-widest text-center focus:border-purple-400 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1" for="reset-password">Mật khẩu mới</label>
                        <input type="password" id="reset-password" placeholder="••••••••" minlength="6" class="w-full bg-surface-container-high/80 border border-gray-700 rounded-xl py-2 px-4 text-white text-sm focus:border-purple-400 outline-none">
                    </div>

                    <button type="button" id="btnResetPassword" onclick="handleResetPasswordSubmit()" class="w-full py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-semibold rounded-xl shadow transition-all">Xác nhận đặt lại mật khẩu</button>
                </div>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="mt-8 pt-4 border-t border-gray-800 text-center text-xs text-gray-500">
            AI Brain Karik System &bull; Supabase PostgreSQL Connected
        </div>
    </div>

    <!-- Frontend Auth JS Script -->
    <script src="/js/auth.js"></script>
    <script>
        function toggleLoginTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const next = isDark ? 'light' : 'dark';
            if (next === 'dark') {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
            } else {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            }
            localStorage.setItem('theme', next);
            updateLoginThemeUI();
        }

        function updateLoginThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('loginThemeIcon');
            const text = document.getElementById('loginThemeText');
            if (icon) {
                icon.textContent = isDark ? 'light_mode' : 'dark_mode';
                icon.className = `material-symbols-outlined text-base ${isDark ? 'text-amber-400' : 'text-purple-600'}`;
            }
            if (text) {
                text.textContent = isDark ? 'Sáng' : 'Tối';
            }
        }
        document.addEventListener('DOMContentLoaded', updateLoginThemeUI);
    </script>
</body>

</html>
